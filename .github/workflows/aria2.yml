name: Build aria2

on:
  workflow_dispatch:
    inputs:
      aria2_version:
        description: "aria2 release version to build"
        required: true
        type: string
        default: "1.37.0"

permissions:
  contents: write

concurrency:
  group: aria2-${{ github.workflow }}-${{ github.ref }}-${{ inputs.aria2_version }}
  cancel-in-progress: true

env:
  ARIA2_VERSION: ${{ inputs.aria2_version }}

jobs:
  build:
    name: aria2-${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64
            os: windows-latest
            platform: windows
            msystem: UCRT64
            resource_name: aria2c.exe
            artifact_name: aria2-windows-x86_64
          - label: windows-aarch64
            os: windows-11-arm
            platform: windows
            msystem: CLANGARM64
            resource_name: aria2c.exe
            artifact_name: aria2-windows-aarch64
          - label: macos-x86_64
            os: macos-15-intel
            platform: macos
            resource_name: aria2c
            artifact_name: aria2-macos-x86_64
          - label: macos-aarch64
            os: macos-14
            platform: macos
            resource_name: aria2c
            artifact_name: aria2-macos-aarch64
          - label: linux-x86_64
            os: ubuntu-24.04
            platform: linux
            resource_name: aria2c
            artifact_name: aria2-linux-x86_64
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            platform: linux
            resource_name: aria2c
            artifact_name: aria2-linux-aarch64

    steps:
      - name: Checkout Ferro
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            autopoint \
            build-essential \
            ca-certificates \
            gettext \
            git \
            libexpat1-dev \
            libsqlite3-dev \
            libssl-dev \
            libtool \
            pkg-config \
            zlib1g-dev

      - name: Build static c-ares from source (Linux)
        if: matrix.platform == 'linux'
        run: |
          set -euxo pipefail
          CARES_VERSION="1.30.0"
          curl -LO "https://github.com/c-ares/c-ares/releases/download/v${CARES_VERSION}/c-ares-${CARES_VERSION}.tar.gz"
          tar -zxf "c-ares-${CARES_VERSION}.tar.gz"
          cd "c-ares-${CARES_VERSION}"
          ./configure --enable-static --disable-shared --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          cd ..
          rm -rf "c-ares-${CARES_VERSION}" "c-ares-${CARES_VERSION}.tar.gz"

      - name: Install macOS build dependencies
        if: matrix.platform == 'macos'
        run: |
          brew install autoconf automake c-ares expat gettext libtool pkg-config sqlite zlib
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix libtool)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Setup MSYS2
        if: matrix.platform == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          cache: true
          install: >-
            base-devel
            git
            autoconf
            automake
            libtool
            gettext-devel
            pkgconf
          pacboy: >-
            toolchain:p
            c-ares:p
            expat:p
            sqlite3:p
            zlib:p

      - name: Build and verify aria2 (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euxo pipefail

          git clone \
            --branch "release-${ARIA2_VERSION}" \
            --depth 1 \
            https://github.com/aria2/aria2.git \
            build/aria2-src

          cd build/aria2-src
          git rev-parse --verify HEAD
          autoreconf -i

          configure_args=(
            --without-libssh2
            --without-libxml2
          )

          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            export CPPFLAGS="-I/usr/local/include"
            export LDFLAGS="-L/usr/local/lib"
            configure_args+=(
              ARIA2_STATIC=yes
              --with-openssl
              --without-gnutls
              --without-libnettle
              --without-libgcrypt
              --disable-nls
              LIBS="-ldl"
            )
          elif [[ "${{ matrix.platform }}" == "macos" ]]; then
            export CPPFLAGS="-I$(brew --prefix c-ares)/include -I$(brew --prefix expat)/include -I$(brew --prefix sqlite)/include -I$(brew --prefix zlib)/include"
            export LDFLAGS="-L$(brew --prefix c-ares)/lib -L$(brew --prefix expat)/lib -L$(brew --prefix sqlite)/lib -L$(brew --prefix zlib)/lib"
            export PKG_CONFIG_PATH="$(brew --prefix c-ares)/lib/pkgconfig:$(brew --prefix expat)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix zlib)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            # macOS does not support fully static linking; use Apple's native
            # TLS (SecureTransport) via --with-appletls for HTTPS support.
            configure_args+=(
              --with-appletls
              --without-openssl
              --without-gnutls
              --without-libnettle
              --without-libgcrypt
              --disable-nls
            )
          fi

          ./configure "${configure_args[@]}"

          jobs="$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 2)"
          make -j"${jobs}"

          artifact_dir="${GITHUB_WORKSPACE}/artifacts/${{ matrix.label }}"
          mkdir -p "${artifact_dir}"
          cp "src/aria2c" "${artifact_dir}/${{ matrix.resource_name }}"
          chmod 755 "${artifact_dir}/${{ matrix.resource_name }}"
          version_output="$("${artifact_dir}/${{ matrix.resource_name }}" --version)"
          printf '%s\n' "${version_output}"
          grep -F "aria2 version ${ARIA2_VERSION}" <<< "${version_output}"
          grep -F "Enabled Features" <<< "${version_output}"
          grep -F "BitTorrent" <<< "${version_output}"
          grep -F "HTTPS" <<< "${version_output}"
          grep -F "Metalink" <<< "${version_output}"

          # On macOS, verify the native AppleTLS backend is linked.
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            grep -F "AppleTLS" <<< "${version_output}"
          fi

          cd "${artifact_dir}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.resource_name }}" > SHA256SUMS
          else
            shasum -a 256 "${{ matrix.resource_name }}" > SHA256SUMS
          fi

      - name: Build and verify aria2 (Windows)
        if: matrix.platform == 'windows'
        shell: msys2 {0}
        run: |
          set -euxo pipefail

          git clone \
            --branch "release-${ARIA2_VERSION}" \
            --depth 1 \
            https://github.com/aria2/aria2.git \
            build/aria2-src

          cd build/aria2-src
          git rev-parse --verify HEAD
          autoreconf -i

          configure_args=(
            --without-libssh2
            --without-libxml2
          )

          # Windows (MSYS2): static linking works; disable external TLS
          # backends so the MSYS2 schannel/WinTLS backend is used.
          configure_args+=(
            ARIA2_STATIC=yes
            --without-openssl
            --without-gnutls
            --without-libnettle
            --without-libgcrypt
            --disable-nls
            ac_cv_func_gai_strerror=yes
          )

          ./configure "${configure_args[@]}"

          jobs="$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.logicalcpu 2>/dev/null || echo 2)"
          make -j"${jobs}"

          artifact_dir="${GITHUB_WORKSPACE}/artifacts/${{ matrix.label }}"
          mkdir -p "${artifact_dir}"
          cp "src/aria2c.exe" "${artifact_dir}/${{ matrix.resource_name }}"
          chmod 755 "${artifact_dir}/${{ matrix.resource_name }}"
          version_output="$("${artifact_dir}/${{ matrix.resource_name }}" --version)"
          printf '%s\n' "${version_output}"
          grep -F "aria2 version ${ARIA2_VERSION}" <<< "${version_output}"
          grep -F "Enabled Features" <<< "${version_output}"
          grep -F "BitTorrent" <<< "${version_output}"
          grep -F "HTTPS" <<< "${version_output}"
          grep -F "Metalink" <<< "${version_output}"

          cd "${artifact_dir}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.resource_name }}" > SHA256SUMS
          else
            shasum -a 256 "${{ matrix.resource_name }}" > SHA256SUMS
          fi

      - name: Upload aria2-${{ matrix.label }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/${{ matrix.label }}
          if-no-files-found: error
          retention-days: 3

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize assets
        run: |
          mkdir -p release-assets

          # 1. Windows x64
          cp artifacts/aria2-windows-x86_64/aria2c.exe release-assets/aria2c-${{ env.ARIA2_VERSION }}-windows-x64.exe

          # 2. Windows ARM64
          cp artifacts/aria2-windows-aarch64/aria2c.exe release-assets/aria2c-${{ env.ARIA2_VERSION }}-windows-arm64.exe

          # 3. macOS x64
          cp artifacts/aria2-macos-x86_64/aria2c release-assets/aria2c-${{ env.ARIA2_VERSION }}-macos-x64
          chmod +x release-assets/aria2c-${{ env.ARIA2_VERSION }}-macos-x64

          # 4. macOS ARM64
          cp artifacts/aria2-macos-aarch64/aria2c release-assets/aria2c-${{ env.ARIA2_VERSION }}-macos-arm64
          chmod +x release-assets/aria2c-${{ env.ARIA2_VERSION }}-macos-arm64

          # 5. Linux x64
          cp artifacts/aria2-linux-x86_64/aria2c release-assets/aria2c-${{ env.ARIA2_VERSION }}-linux-x64
          chmod +x release-assets/aria2c-${{ env.ARIA2_VERSION }}-linux-x64

          # 6. Linux ARM64
          cp artifacts/aria2-linux-aarch64/aria2c release-assets/aria2c-${{ env.ARIA2_VERSION }}-linux-arm64
          chmod +x release-assets/aria2c-${{ env.ARIA2_VERSION }}-linux-arm64

          # 7. Generate SHA256 checksums for each individual binary
          cd release-assets
          for file in *; do
            if [ -f "$file" ]; then
              sha256sum "$file" > "${file}.sha256"
            fi
          done

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ env.ARIA2_VERSION }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Uploading new/updated assets..."
            gh release upload "$tag" release-assets/* --clobber
          else
            echo "Creating new release $tag..."
            gh release create "$tag" \
              --title "aria2 v${{ env.ARIA2_VERSION }}" \
              --notes "Static builds of aria2 version ${{ env.ARIA2_VERSION }} for Windows, macOS, and Linux." \
              release-assets/*
          fi
